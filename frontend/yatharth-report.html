#sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;display:block;pointer-events:none}
.wrap{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:40px 22px 72px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

/* ---------- heading ---------- */
header{position:relative;text-align:center;padding-top:18px}
.mark{font-family:"Cinzel",serif;font-weight:800;font-size:clamp(52px,10vw,104px);line-height:1;letter-spacing:.04em;
  background:linear-gradient(180deg,#fff1bf 0%,var(--gold-hi) 28%,var(--gold) 60%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(242,189,76,.45)) drop-shadow(0 0 60px rgba(242,140,30,.25))}
.sub{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;font-family:"Cinzel",serif;font-weight:700;font-size:13px;letter-spacing:.5em;color:var(--gold);padding-left:.5em}
.sub::before,.sub::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-line))}
.sub::after{transform:scaleX(-1)}
.asked{display:inline-block;margin:26px auto 0;max-width:640px;text-align:left;padding:12px 16px;border-radius:10px;
  background:rgba(10,9,24,.82);border:1px solid rgba(242,189,76,.35)}
.asked small{display:block;font-family:"Cinzel",serif;font-size:10.5px;font-weight:700;letter-spacing:.24em;color:var(--gold);margin-bottom:5px}
.asked p{font-family:"Cinzel",serif;font-size:14px;line-height:1.55;color:var(--text);letter-spacing:.02em}
.close{position:absolute;right:0;top:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(10,9,24,.8);border:1px solid var(--gold-line);color:var(--gold-hi);transition:transform .25s,box-shadow .25s}
.close:hover{transform:rotate(90deg);box-shadow:0 0 22px rgba(242,189,76,.4)}
.close svg{width:16px;height:16px}

/* ---------- golden glass panel ---------- */
.panel{position:relative;background:var(--glass);border:1px solid var(--gold-line);border-radius:18px;
  box-shadow:0 0 26px -6px rgba(242,189,76,.35),inset 0 0 22px rgba(242,189,76,.05);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* ---------- score ---------- */
.score{margin-top:34px;padding:24px 28px;display:grid;grid-template-columns:270px 1fr auto;gap:26px;align-items:center}
.gauge{position:relative;width:270px;height:226px}
.gauge svg{width:100%;height:162px;overflow:visible;display:block}
.g-read{position:absolute;left:0;right:0;bottom:0;text-align:center}
.g-num{font-family:"Fraunces",serif;font-weight:600;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold-hi);transition:color .6s;text-shadow:0 0 18px currentColor}
.g-lbl{font-family:"Cinzel",serif;font-size:10.5px;font-weight:700;letter-spacing:.3em;color:var(--gold);margin-top:4px}
#arcGold,#arcFinal{transition:opacity .6s}
.s-mid h2{font-family:"Fraunces",serif;font-weight:500;font-size:24px;line-height:1.22}
.s-mid p{color:var(--muted);font-size:14.5px;line-height:1.55;margin-top:6px;max-width:420px}
.tally{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;font-size:13px;color:var(--muted)}
.tally span{display:inline-flex;align-items:center;gap:7px}
.tally b{color:var(--text)}
.tally i{width:8px;height:8px;border-radius:50%;display:inline-block}
.checked{margin-top:12px;font-size:12px;color:var(--dim);font-weight:600}
.verdict{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:120px;opacity:0;transform:scale(.8);transition:opacity .5s,transform .5s cubic-bezier(.3,1.6,.5,1)}
.verdict.on{opacity:1;transform:none}
.badge{width:62px;height:62px;border-radius:50%;display:grid;place-items:center}
.badge svg{width:30px;height:30px}
.badge.ok{background:var(--fresh);color:#032010;box-shadow:0 0 0 6px rgba(47,224,143,.14),0 0 30px rgba(47,224,143,.5)}
.badge.bad{background:var(--stale);color:#2a0400;box-shadow:0 0 0 6px rgba(255,93,80,.14),0 0 30px rgba(255,93,80,.5)}
.verdict b{font-size:14px;font-weight:800}
.verdict span{display:block;font-size:12px;color:var(--muted);margin-top:2px;max-width:140px}

/* ---------- section head ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:46px 0 22px;flex-wrap:wrap}
.sec h3{font-family:"Cinzel",serif;font-weight:700;font-size:24px;letter-spacing:.08em;color:var(--gold-hi);text-shadow:0 0 16px rgba(242,189,76,.35)}
.sec h3 small{font-family:"Manrope",sans-serif;font-size:13px;color:var(--muted);font-weight:600;margin-left:12px;letter-spacing:0;text-shadow:none}
.seg{display:inline-flex;padding:3px;border-radius:99px;border:1px solid var(--gold-line);background:rgba(10,9,24,.8)}
.seg button{font-size:13px;font-weight:700;padding:7px 15px;border-radius:99px;color:var(--gold-hi);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1d1200}

/* ---------- golden flashcard ---------- */
.card{position:relative;border-radius:16px;padding:22px 24px 20px;display:flex;flex-direction:column;color:var(--text);
  background:linear-gradient(165deg,#1c1536,#08071a 70%);
  border:1px solid var(--gold-line);
  box-shadow:0 0 28px -6px rgba(242,189,76,.38),0 22px 50px -22px rgba(0,0,0,.95)}
.card::before{content:"";position:absolute;inset:7px;border-radius:11px;border:1px solid rgba(242,189,76,.14);pointer-events:none}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.no{font-family:"Cinzel",serif;font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--gold)}
.no b{color:var(--gold-hi);font-size:14px}
.cat{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px;letter-spacing:.02em}
.lbl{display:block;font-family:"Cinzel",serif;font-weight:700;font-size:10.5px;letter-spacing:.22em;color:rgba(242,189,76,.75)}
.c-said{margin-top:20px}
.c-claim{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(20px,3vw,24px);line-height:1.32;margin-top:7px;color:var(--text)}
.c-div{height:1px;margin:18px 0 16px;background:linear-gradient(90deg,var(--gold-line),rgba(242,189,76,.1) 70%,transparent)}
.c-val{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(19px,2.6vw,22px);line-height:1.35;margin-top:7px;color:var(--gold-hi)}
.c-val span{background:rgba(242,189,76,.13);border-radius:4px;padding:0 5px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.c-why{margin-top:12px;font-size:14px;line-height:1.6;color:var(--muted)}
.c-src{margin-top:16px}
.c-src a{display:block;margin-top:8px;text-decoration:none;font-size:13.5px;font-weight:600;color:var(--gold-hi);line-height:1.4}
.c-src a .t{text-decoration:underline;text-decoration-color:rgba(242,189,76,.35);text-underline-offset:3px}
.c-src a:hover .t{text-decoration-color:var(--gold-hi)}
.c-src a small{display:block;margin-top:2px;font-weight:500;font-size:12px;color:var(--dim)}
.c-src em{display:block;margin-top:6px;font-size:13px;color:var(--dim)}
.c-foot{margin-top:auto;padding-top:18px;display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--gold)}
.c-foot svg{width:15px;height:15px}

/* highlighted stamp */

       '<button class="arrow" id="nxt" aria-label="Next claim">'+I.right+'</button></div>'+
       '<p class="hint" id="hint"></p></div>';
    h+='<div class="grid" id="grid" data-cols="'+Math.min(n,4)+'" hidden>'+claims.map(function(c,i){return cardHtml(c,i,n,false)}).join("")+'</div>';
  }

  if(data.correctedAnswer){
    h+='<section class="panel answer"><div class="a-k">'+(ok?'VERIFIED ANSWER':'CORRECTED ANSWER')+'</div>'+
       '<p class="a-text" id="answer">'+highlight(data.correctedAnswer,claims)+'</p>'+
       '<div class="actions"><button class="btn solid" id="btnCopy">'+I.copy+'Copy answer</button>'+
       '<button class="btn ghost" id="btnDl">'+I.dl+'Download report</button>'+
       '<button class="btn ghost" id="btnAgain">'+I.again+'Check another</button></div></section>';
  }
  h+='<footer>YATHARTH · TRUTH, CHECKED</footer>';
  document.getElementById("app").innerHTML=h;

  runGauge(score,CX,CY);
  bind();
  if(n)layout();
}

/* ================= score meter: sweep to 100 in gold, then settle on the real score ================= */
function runGauge(score,CX,CY){
  var run=++gaugeRun,gold=document.getElementById("arcGold"),fin=document.getElementById("arcFinal"),
      needle=document.getElementById("needle"),num=document.getElementById("gNum"),verdict=document.getElementById("verdict");
  function set(v){
    var d=Math.max(0,Math.min(100,v));
    gold.setAttribute("stroke-dasharray",d.toFixed(2)+" 101");fin.setAttribute("stroke-dasharray",d.toFixed(2)+" 101");
    gold.style.visibility=d<.4?"hidden":"visible";fin.style.visibility=d<.4?"hidden":"visible";
    needle.setAttribute("transform","rotate("+(d*1.8).toFixed(2)+" "+CX+" "+CY+")");
    num.textContent=Math.round(d);
  }
  function finish(){set(score);gold.style.opacity="0";fin.style.opacity="1";num.style.color=score>=TRUST?"var(--fresh)":"var(--stale)";verdict.classList.add("on")}
  if(reduce){finish();return}
  set(0);
  var UP=1100,HOLD=320,DOWN=1300,t0=null;
  function ease(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2}
  function step(now){
    if(run!==gaugeRun)return;
    if(t0===null)t0=now;var t=now-t0;
    if(t<UP){set(100*ease(t/UP))}
    else if(t<UP+HOLD){set(100)}
    else if(t<UP+HOLD+DOWN){var p=(t-UP-HOLD)/DOWN;set(100-(100-score)*(1-Math.pow(1-p,3)))}
    else{finish();return}
    requestAnimationFrame(step);
  }
  setTimeout(function(){requestAnimationFrame(step)},250);
}

/* ================= deck: tap a card, the next one comes up ================= */
function layout(){
  var cards=document.querySelectorAll(".fc"),n=cards.length;
  for(var i=0;i<n;i++){var el=cards[i],rel=i-idx;
    el.dataset.pos=rel<0?"gone":rel>2?"far":String(rel);
    el.setAttribute("aria-hidden",rel===0?"false":"true");
    el.tabIndex=rel===0?0:-1;
    var ls=el.querySelectorAll("a");for(var b=0;b<ls.length;b++)ls[b].tabIndex=rel===0?0:-1;
  }
  seen[idx]=1;
  var dots=document.querySelectorAll(".dots i");
  for(var d=0;d<dots.length;d++)dots[d].className=d===idx?"on":(seen[d]?"seen":"");
  document.getElementById("prev").disabled=idx===0;
  document.getElementById("hint").textContent=idx<n-1?"Tap the card to bring up claim "+(idx+2):"That's the last one. Tap it to see every claim together.";
}
function next(){if(idx<claims.length-1){idx++;layout();focusTop()}else setMode("all",true)}
function prev(){if(idx>0){idx--;layout();focusTop()}}
function focusTop(){var t=document.querySelector('.fc[data-pos="0"]');if(t)t.focus({preventScroll:true})}
function setMode(m,scroll){
  var dw=document.getElementById("deckWrap"),gr=document.getElementById("grid");if(!dw)return;
  if(m===mode&&m==="all")return;
  mode=m;clearTimeout(blinkT);
  dw.hidden=m!=="deck";gr.hidden=m!=="all";
  document.getElementById("mDeck").setAttribute("aria-pressed",m==="deck");
  document.getElementById("mAll").setAttribute("aria-pressed",m==="all");
  if(m==="all"){
    // two golden blinks, then the cards appear side by side
    gr.classList.remove("pre");void gr.offsetWidth;gr.classList.add("pre");
    var cs=gr.querySelectorAll(".card");for(var i=0;i<cs.length;i++){cs[i].style.animationDelay=(i*.06)+"s";
      for(var k=0;k<cs[i].children.length;k++)cs[i].children[k].style.transitionDelay=(i*.09)+"s";}
    blinkT=setTimeout(function(){gr.classList.remove("pre")},reduce?0:1000+cs.length*60);
  }else{idx=0;seen={};layout()}
  if(scroll)document.getElementById("claimsTop").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
}

function highlight(text,cl){
  var out=esc(text);
  cl.forEach(function(c){if(!c.correct||c.correct.length>40)return;var e=esc(c.correct);
    var i=out.indexOf(e);if(i>-1)out=out.slice(0,i)+"<mark>"+e+"</mark>"+out.slice(i+e.length);});
  return out;
}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},1800)}
function tell(type){if(window.parent!==window)window.parent.postMessage({type:type},"*");window.dispatchEvent(new CustomEvent(type))}
function md(){var d=current||{},L=["# Yatharth Report",""];
  if(d.question)L.push("**Question:** "+d.question,"");
  var s=typeof d.score==="number"?d.score:0;L.push("**Score:** "+s+"/100 "+(s>=TRUST?"✅ Verified fresh":"❗ Needs correction"),"**Checked on:** "+(d.checkedOn||""),"","## Claims","");
  (d.claims||[]).forEach(function(c,i){L.push("### "+(i+1)+". ["+ST[norm(c.status)].label.toUpperCase()+"] "+c.claim);
    if(c.category)L.push("- Category: "+c.category);if(c.explanation)L.push("- Finding: "+c.explanation);if(c.correct)L.push("- **Correct:** "+c.correct);
    (c.sources||[]).forEach(function(x){L.push("- Source ("+(x.type||"Web")+"): ["+x.title+"]("+x.url+")")});L.push("");});
  if(d.correctedAnswer)L.push("## Corrected answer","",d.correctedAnswer,"");return L.join("\n");}
function bind(){
  var g=function(id){return document.getElementById(id)};
  g("btnClose").onclick=function(){tell("yatharth:report-close");if(window.parent===window&&history.length>1)history.back()};
  var deck=g("deck");
  if(deck){
    deck.addEventListener("click",function(e){
      if(e.target.closest("a"))return;
      var c=e.target.closest(".fc");if(c&&c.dataset.pos==="0")next();
    });
    deck.addEventListener("keydown",function(e){
      if(!e.target.classList||!e.target.classList.contains("fc"))return;
      if(e.key==="Enter"||e.key===" "){e.preventDefault();next()}
    });
    g("prev").onclick=prev;g("nxt").onclick=next;
    g("mDeck").onclick=function(){setMode("deck")};g("mAll").onclick=function(){setMode("all")};
  }
  if(g("btnCopy"))g("btnCopy").onclick=function(){var t=current.correctedAnswer||"";
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast("Answer copied")},function(){
      var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Answer copied")}catch(e){toast("Copy not allowed")}a.remove();});};
  if(g("btnDl"))g("btnDl").onclick=function(){var b=new Blob([md()],{type:"text/markdown"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="yatharth-report-"+(current.checkedOn||"today")+".md";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);toast("Report downloaded")};
  if(g("btnAgain"))g("btnAgain").onclick=function(){tell("yatharth:check-another")};
}
document.addEventListener("keydown",function(e){
  if(mode!=="deck"||!claims.length||/input|textarea/i.test(e.target.tagName||""))return;
  if(e.key==="ArrowRight")next();else if(e.key==="ArrowLeft")prev();
});

window.YatharthReport={render:render,get data(){return current},TRUST:TRUST};
addEventListener("message",function(e){if(e.data&&e.data.type==="yatharth:report"&&e.data.report)render(e.data.report)});
var initial={};try{initial=JSON.parse(document.getElementById("report-data").textContent)}catch(e){}
if(/[?&]demo=fresh/.test(location.search)){initial={question:"Who wrote the Bhagavad Gita and in which language?",score:100,checkedOn:initial.checkedOn,
  claims:[{status:"fresh",category:"History",claim:"The Bhagavad Gita is traditionally attributed to Vyasa.",explanation:"Classical tradition credits Sage Vyasa as the author, as part of the Mahabharata.",sources:[{type:"Web",title:"Bhagavad Gita - Wikipedia",url:"https://en.wikipedia.org/wiki/Bhagavad_Gita"}]},
  {status:"fresh",category:"Language",claim:"It was composed in Sanskrit.",explanation:"The original text is written in Sanskrit verse.",sources:[{type:"Web",title:"Bhagavad Gita | Britannica",url:"https://www.britannica.com/topic/Bhagavadgita"}]}],
  correctedAnswer:"The Bhagavad Gita is traditionally attributed to Vyasa and was composed in Sanskrit."};}
if(/[?&]demo=four/.test(location.search)){var base=initial.claims||[];initial.claims=base.concat([
  {status:"fresh",category:"Language",claim:"Python is an interpreted, high-level language.",explanation:"Still accurate.",sources:[{type:"Web",title:"Python (programming language) - Wikipedia",url:"https://en.wikipedia.org/wiki/Python_(programming_language)"}]},
  {status:"unverified",category:"Release",claim:"Python 4 is planned for 2027.",explanation:"No official announcement was found.",sources:[]}]);}
render(initial);
})();

#snd svg{width:18px;height:18px}
.gold-btn{font-family:"Cinzel",serif;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#ffe9b0;cursor:pointer;
  background:linear-gradient(180deg,rgba(70,44,8,.55),rgba(12,10,26,.7));border:1.5px solid #f2b947;border-radius:999px;
  box-shadow:0 0 22px rgba(255,165,40,.55),0 0 60px rgba(255,140,20,.25),inset 0 0 16px rgba(255,195,90,.3);
  text-shadow:0 0 10px rgba(255,190,80,.8);transition:box-shadow .3s,transform .5s,background .3s,opacity .9s}
.gold-btn:hover{box-shadow:0 0 30px rgba(255,180,60,.85),0 0 90px rgba(255,150,30,.4),inset 0 0 20px rgba(255,205,110,.45);background:linear-gradient(180deg,rgba(110,70,12,.6),rgba(20,14,30,.7))}
#cont{position:fixed;left:50%;transform:translate(-50%,-50%) scale(.92);padding:.85em 2.2em .85em 2.5em;font-size:clamp(13px,1.45vw,22px);
  display:flex;align-items:center;gap:.7em;opacity:0;pointer-events:none;z-index:3}
#cont.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#cont svg{width:1.1em;height:1.1em}
#prompt{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3.5vh,36px);
  padding:24px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity 1s .4s}
#prompt.show{opacity:1;pointer-events:auto}
#prompt h1{margin:0;font-family:"Cinzel",serif;font-weight:700;font-size:clamp(34px,6vw,88px);letter-spacing:.04em;
  background:linear-gradient(180deg,#fff6d0 0%,#ffd77a 35%,#f2a93a 70%,#b8701f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,160,40,.55)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
#sent{width:min(760px,92vw);max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
#sent:empty{display:none}
.msg{align-self:flex-end;max-width:85%;font-family:"Cinzel",serif;letter-spacing:.03em;font-size:15px;line-height:1.5;color:#fdf1d6;white-space:pre-wrap;overflow-wrap:anywhere;
  background:rgba(40,28,10,.55);border:1px solid rgba(242,185,71,.55);border-radius:16px 16px 4px 16px;padding:10px 14px;box-shadow:0 0 14px rgba(255,160,40,.2)}
#pform{position:relative;width:min(760px,92vw);border-radius:22px;padding:2px;margin:0;
  background:linear-gradient(135deg,#ffe29a,#e9a13a 40%,#7a4a14 60%,#f6c35c);box-shadow:0 0 30px rgba(255,160,40,.45),0 0 90px rgba(255,140,20,.18)}
#pform .in{display:flex;align-items:flex-end;gap:12px;border-radius:20px;padding:14px 14px 14px 22px;background:rgb(6,10,28)}
#ptext{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fdf1d6;font-family:"Cinzel",serif;font-weight:500;letter-spacing:.04em;font-size:17px;line-height:1.5;
  min-height:52px;max-height:30vh;padding:6px 0}
#ptext::placeholder{color:rgba(240,210,150,.55);letter-spacing:.08em}
#pform .row{display:flex;align-items:flex-end;gap:12px}
#pform .in{flex-direction:column;align-items:stretch;gap:10px;padding-left:14px}
#pattach{flex:none;width:44px;height:44px;margin-bottom:2px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#ffd77a;
  background:rgba(40,28,10,.55);border:1px solid rgba(242,185,71,.6);box-shadow:0 0 12px rgba(255,160,40,.25);transition:box-shadow .2s,transform .2s}
#pattach:hover,#pattach:focus-visible{box-shadow:0 0 20px rgba(255,170,50,.6);transform:scale(1.06);outline:0}
#pattach svg{width:21px;height:21px}
#pfile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#chips{display:flex;flex-wrap:wrap;gap:8px}
#chips:empty{display:none}
.chip{display:flex;align-items:center;gap:8px;max-width:100%;font-family:"Cinzel",serif;font-size:13px;letter-spacing:.03em;color:#fdf1d6;
  background:rgba(40,28,10,.6);border:1px solid rgba(242,185,71,.55);border-radius:12px;padding:6px 8px 6px 10px}
.chip img{width:28px;height:28px;object-fit:cover;border-radius:6px}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.chip .sz{color:rgba(240,210,150,.6);font-size:11px}
.chip button{border:0;background:transparent;color:#ffd77a;cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.msg .files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.msg .files span{font-size:12px;border:1px solid rgba(242,185,71,.45);border-radius:8px;padding:3px 8px;color:#ffe3a3}
#psend{flex:none;width:48px;height:48px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;letter-spacing:0}
#psend svg{width:22px;height:22px}
#pform.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
<style id="yx">
.msg.bot{align-self:flex-start;border-radius:16px 16px 16px 4px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}
.msg.bot.link{cursor:pointer;text-decoration:underline}
.msg.bot.err{border-color:rgba(255,122,89,.75);color:#ffd2c6}
#ex{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(760px,92vw)}
#ex button{font-family:"Cinzel",serif;font-size:13px;letter-spacing:.04em;color:#fdf1d6;background:rgba(40,28,10,.6);border:1px solid rgba(242,185,71,.55);border-radius:999px;padding:8px 16px;cursor:pointer;transition:box-shadow .3s}
#ex button:hover,#ex button:focus-visible{box-shadow:0 0 16px rgba(255,170,50,.5);outline:0}
#skipi{position:fixed;top:16px;right:18px;z-index:5;background:none;border:0;color:rgba(255,215,122,.85);font-family:"Cinzel",serif;letter-spacing:.2em;font-size:13px;text-transform:uppercase;cursor:pointer}
#skipi[hidden]{display:none}
#modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#modes button{font-family:"Cinzel",serif;font-size:13px;letter-spacing:.06em;color:#fdf1d6;background:transparent;border:1px solid rgba(242,185,71,.35);border-radius:10px;padding:8px 16px;cursor:pointer}
#modes button.on{background:rgba(242,185,71,.22);border-color:#f2b947;box-shadow:0 0 14px rgba(255,170,50,.35)}
#tools{position:fixed;top:14px;left:16px;z-index:10;display:none;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 90px)}
#tools.on{display:flex}
#tools button,#hist button,#trmenu button,#modes select,#modes #mic{font-family:"Cinzel",serif;letter-spacing:.05em;cursor:pointer}
#tools button{font-size:12px;color:#ffe9b0;background:rgba(8,10,28,.78);border:1px solid rgba(242,185,71,.45);border-radius:10px;padding:7px 12px;backdrop-filter:blur(6px)}
#tools button:hover{border-color:#f2b947;box-shadow:0 0 12px rgba(255,170,50,.35)}
#tools .r{display:none}#tools.rep .r{display:inline-block}
#hist,#trmenu{position:fixed;top:56px;left:16px;z-index:11;background:rgba(5,7,20,.97);border:1px solid rgba(242,185,71,.5);border-radius:14px;color:#eceaf5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#hist[hidden],#trmenu[hidden]{display:none}
#hist{width:min(380px,92vw);max-height:70vh;overflow:auto;padding:12px}
#hist .ht{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#ffd77a}
#hist .ht button{font-size:11px;background:none;border:1px solid rgba(242,185,71,.4);color:#ffe9b0;border-radius:8px;padding:4px 10px}
#hist p{color:#a9aec8;margin:6px 2px}
#hist .hi{display:flex;gap:6px;margin-bottom:6px}
#hist .hi>button:first-child{flex:1;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:2px 10px;align-items:center;background:rgba(14,18,44,.8);border:1px solid #2a2f55;border-radius:10px;color:#eceaf5;padding:8px 10px;font-family:inherit;letter-spacing:0}
#hist .hi>button:first-child:hover{border-color:#f2b947}
#hist .sc{grid-row:span 2;font-weight:700;font-size:20px;color:#ffd77a;text-align:center}
#hist .tx{font-size:14px}#hist small{color:#8d93b5;font-size:12px}
#hist .x{background:none;border:1px solid #2a2f55;border-radius:10px;color:#a9aec8;width:34px;font-size:18px;letter-spacing:0}
#trmenu{padding:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;width:min(300px,92vw)}
#trmenu button{font-size:12px;color:#ffe9b0;background:rgba(14,18,44,.8);border:1px solid #2a2f55;border-radius:8px;padding:8px}
#trmenu button:hover{border-color:#f2b947}
#modes select{background:#0b0f26;color:#fdf1d6;border:1px solid rgba(242,185,71,.35);border-radius:10px;padding:8px 10px;font-size:13px}
#modes #mic{font-size:13px;color:#fdf1d6;background:transparent;border:1px solid rgba(242,185,71,.35);border-radius:10px;padding:8px 16px}
#modes #mic.live{background:rgba(255,90,70,.25);border-color:#ff7a59}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:12;background:rgba(5,7,20,.97);border:1px solid rgba(242,185,71,.6);color:#ffe9b0;border-radius:999px;padding:10px 20px;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}

</style>
</head>

</button>

  busy=true;$("#psend").disabled=true;
  lastQ=(isUrl?"Page: "+text:(text||("Attached: "+files.map(f=>f.name).join(", ")))).slice(0,300);
  const t0=Date.now(),m=bot("Checking… 0s");
  timer=setInterval(()=>{m.textContent=`Checking… ${Math.round((Date.now()-t0)/1000)}s (usually under a minute)`},1000);
  const ctl=new AbortController(),kill=setTimeout(()=>ctl.abort(),120000);
  try{
    let r;
    if(files.length){const fd=new FormData();fd.append("answer_text",text);files.forEach(f=>fd.append("files",f));r=await fetch(API+"/api/check-files",{method:"POST",body:fd,signal:ctl.signal})}
    else{const ep=isUrl?"/api/check-url":mode==="ask"?"/api/ask":"/api/check",bd=isUrl?{url:text}:mode==="ask"?{question:text}:{answer_text:text};
      r=await fetch(API+ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(bd),signal:ctl.signal})}
    const d=await r.json();
    if(!r.ok)throw new Error(typeof d.detail==="string"?d.detail:"Request failed");
    m.textContent=`Freshness ${d.freshness_score}/100. Tap to open the report.`;m.classList.add("link");m.onclick=()=>show(d);show(d);
  }catch(err){
    m.classList.add("err");m.textContent=err.name==="AbortError"?"Stopped after 2 minutes. Look at the backend terminal (the [llm] and [tavily] lines) to see where it got stuck.":err.message==="Failed to fetch"?`Cannot reach the Yatharth backend at ${API}. Is it running?`:err.message;
    restore(text,files);
  }finally{clearInterval(timer);clearTimeout(kill);busy=false;$("#psend").disabled=false}
});

/* ===== Toolbar: new chat, history, translate, share. Voice input. Report screen. ===== */
const tb=document.createElement("div");tb.id="tools";
tb.innerHTML='<button type="button" id="tNew">New chat</button><button type="button" id="tHist">History</button><button type="button" id="tTr" class="r">Translate</button><button type="button" id="tSh" class="r">Share</button>';
document.body.appendChild(tb);
const hist=document.createElement("div");hist.id="hist";hist.hidden=true;document.body.appendChild(hist);
const trm=document.createElement("div");trm.id="trmenu";trm.hidden=true;document.body.appendChild(trm);
const toastEl=document.createElement("div");toastEl.id="toast";document.body.appendChild(toastEl);
let toastT=null;
function toast(msg,keep){toastEl.textContent=msg;toastEl.classList.add("on");clearTimeout(toastT);if(!keep)toastT=setTimeout(()=>toastEl.classList.remove("on"),2400)}
cont.addEventListener("click",()=>tb.classList.add("on"));

/* ---- the report screen (your own design in yatharth-report.html, shown full-screen in an iframe) ---- */
let frame=null,frameReady=false,pending=null,origRep=null,trCache={};
function toReport(d,q){
  return{question:q,score:d.freshness_score,checkedOn:d.checked_on,correctedAnswer:d.corrected_answer,
    claims:d.claims.map(c=>({status:c.verdict,category:c.category?c.category.charAt(0).toUpperCase()+c.category.slice(1):"",
      claim:c.text,explanation:c.why||"",correct:c.corrected||"",
      sources:c.evidence?[{type:c.evidence.trust,title:c.evidence.title,url:c.evidence.url}]:[]}))}}
function send(){
  frame.contentWindow.postMessage({type:"yatharth:report",report:pending},"*");
  setTimeout(()=>{frame.style.visibility="visible";frame.focus()},250)}   /* stays hidden until the data is drawn */
function showReport(rep,isNew=true){
  pending=rep;if(isNew){origRep=rep;trCache={}}
  tb.classList.add("on","rep");
  if(!frame){
    frame=document.createElement("iframe");frame.src="yatharth-report.html";frame.title="Yatharth report";
    frame.style.cssText="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:9;background:#02040b;visibility:hidden";
    frame.onload=()=>{frameReady=true;send()};
    document.body.appendChild(frame)}
  else if(frameReady)send()}
function show(d){const rep=toReport(d,lastQ);saveHistory(rep);showReport(rep)}
function hide(){if(frame)frame.style.visibility="hidden";tb.classList.remove("rep");hist.hidden=true;trm.hidden=true;ptext.focus()}
addEventListener("message",e=>{
  const ty=e.data&&e.data.type;
  if(frame&&e.source===frame.contentWindow&&(ty==="yatharth:report-close"||ty==="yatharth:check-another"))hide()});

/* ---- history (saved in this browser only) ---- */
const HK="yatharth_history";
const loadH=()=>{try{return JSON.parse(localStorage.getItem(HK)||"[]")}catch(e){return[]}};
function saveHistory(rep){try{const h=loadH();h.unshift({t:Date.now(),q:rep.question||"",s:rep.score,rep});localStorage.setItem(HK,JSON.stringify(h.slice(0,20)))}catch(e){}}
function drawHist(){
  const h=loadH();hist.textContent="";
  const top=document.createElement("div");top.className="ht";
  const t=document.createElement("b");t.textContent="History";
  const clr=document.createElement("button");clr.type="button";clr.textContent="Clear all";
  clr.onclick=()=>{try{localStorage.removeItem(HK)}catch(e){}drawHist()};
  top.append(t,clr);hist.appendChild(top);
  if(!h.length){const p=document.createElement("p");p.textContent="No checks yet.";hist.appendChild(p);return}
  h.forEach((it,i)=>{
    const row=document.createElement("div");row.className="hi";
    const b=document.createElement("button");b.type="button";
    const sc=document.createElement("span");sc.className="sc";sc.textContent=it.s;
    const tx=document.createElement("span");tx.className="tx";tx.textContent=(it.q||"Untitled check").slice(0,90);
    const dt=document.createElement("small");dt.textContent=new Date(it.t).toLocaleString();
    b.append(sc,tx,dt);b.onclick=()=>{hist.hidden=true;showReport(it.rep)};
    const x=document.createElement("button");x.type="button";x.className="x";x.textContent="\u00d7";x.setAttribute("aria-label","Delete");
    x.onclick=()=>{const a=loadH();a.splice(i,1);try{localStorage.setItem(HK,JSON.stringify(a))}catch(e){}drawHist()};
    row.append(b,x);hist.appendChild(row)})}

/* ---- share: the report is packed into the link itself, so no server storage is needed ---- */
async function enc(rep){
  const bytes=new TextEncoder().encode(JSON.stringify(rep));let pre="u.",buf=bytes;
  if(window.CompressionStream){try{const cs=new CompressionStream("gzip"),w=cs.writable.getWriter();w.write(bytes);w.close();buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());pre="z."}catch(e){}}
  let s="";buf.forEach(b=>s+=String.fromCharCode(b));
  return pre+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function dec(str){
  const pre=str.slice(0,2),b=str.slice(2).replace(/-/g,"+").replace(/_/g,"/");
  let buf=Uint8Array.from(atob(b+"=".repeat((4-b.length%4)%4)),c=>c.charCodeAt(0));
  if(pre==="z."){const ds=new DecompressionStream("gzip"),w=ds.writable.getWriter();w.write(buf);w.close();buf=new Uint8Array(await new Response(ds.readable).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(buf))}
const S=(v,n=2000)=>String(v??"").slice(0,n);
function clean(r){   /* never trust data that arrives in a link */
  return{question:S(r.question,300),score:Math.max(0,Math.min(100,Number(r.score)||0)),checkedOn:S(r.checkedOn,20),correctedAnswer:S(r.correctedAnswer,4000),
    claims:(Array.isArray(r.claims)?r.claims:[]).slice(0,30).map(c=>({status:["fresh","stale","unverified","not_checked"].includes(c.status)?c.status:"unverified",
      category:S(c.category,40),claim:S(c.claim),explanation:S(c.explanation),correct:S(c.correct),
      sources:(Array.isArray(c.sources)?c.sources:[]).slice(0,5).map(s=>({type:S(s.type,40),title:S(s.title,200),url:/^https?:\/\//.test(s.url)?S(s.url,1000):""}))}))}}
async function loadShared(){
  const m=location.hash.match(/^#r=([zu]\.[A-Za-z0-9_-]+)$/);if(!m)return null;
  try{return clean(await dec(m[1]))}catch(e){return null}}
async function share(){
  if(!pending)return;
  const url=location.href.split("#")[0]+"#r="+await enc(pending);
  try{if(navigator.share){await navigator.share({title:"Yatharth report",text:"Yatharth freshness check: "+pending.score+"/100",url});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(url);toast("Link copied")}catch(e){window.prompt("Copy this link:",url)}}

/* ---- translate the report (backend asks the model through Bifrost) ---- */
const LANGS=[["Original",null],["English","English"],["Hindi","Hindi"],["Hinglish","Hinglish (Hindi written in English letters)"],["Bengali","Bengali"],["Tamil","Tamil"],["Telugu","Telugu"],["Marathi","Marathi"],["Gujarati","Gujarati"],["Spanish","Spanish"],["French","French"],["German","German"]];
for(const [label,target] of LANGS){const b=document.createElement("button");b.type="button";b.textContent=label;b.onclick=()=>doTranslate(label,target);trm.appendChild(b)}
async function doTranslate(label,target){
  trm.hidden=true;if(!origRep)return;
  if(!target){showReport(origRep,false);return}
  if(trCache[label]){showReport(trCache[label],false);return}
  const clone=JSON.parse(JSON.stringify(origRep)),slots=[],add=(o,k)=>{if(o[k])slots.push([o,k])};
  add(clone,"question");add(clone,"correctedAnswer");
  clone.claims.forEach(c=>["claim","explanation","correct","category"].forEach(k=>add(c,k)));
  if(!slots.length)return;
  toast("Translating to "+label+"…",true);
  try{
    const r=await fetch(API+"/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({target,texts:slots.map(([o,k])=>o[k])})});
    const d=await r.json();
    if(!r.ok)throw new Error(typeof d.detail==="string"?d.detail:"Translation failed");
    slots.forEach(([o,k],i)=>{o[k]=String(d.texts[i]??o[k])});
    trCache[label]=clone;showReport(clone,false);toast("Translated to "+label)
  }catch(e){toast(e.message==="Failed to fetch"?"Cannot reach the backend.":e.message)}}

/* ---- new chat ---- */
function newChat(){
  if(busy){toast("Please wait for the current check to finish.");return}
  hide();sent.innerHTML="";ptext.value="";
  [...document.querySelectorAll("#chips button")].reverse().forEach(b=>b.click());   /* removes attached files */
  origRep=null;pending=null;trCache={};mrow.firstChild.click();toast("New chat")}

/* ---- voice input (transcribe): uses the browser's speech recognition, works in Chrome and Edge ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=document.createElement("button");mic.type="button";mic.id="mic";mic.textContent="Speak";
const vl=document.createElement("select");vl.setAttribute("aria-label","Voice language");
for(const [v,l] of [["en-IN","English"],["hi-IN","Hindi"],["en-US","English (US)"]]){const o=document.createElement("option");o.value=v;o.textContent=l;vl.appendChild(o)}
mrow.append(mic,vl);
let rec=null,base="";
mic.onclick=()=>{
  if(!SR){bot("Voice input works in Chrome or Edge. Please open Yatharth in one of them.","err");return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=vl.value;rec.interimResults=true;rec.continuous=true;
  base=ptext.value?ptext.value.trimEnd()+" ":"";
  rec.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;ptext.value=base+t};
  rec.onend=()=>{rec=null;mic.classList.remove("live");mic.textContent="Speak"};
  rec.onerror=e=>bot(e.error==="not-allowed"?"Microphone is blocked. Allow it from the lock icon in the address bar.":"Voice input stopped ("+e.error+").","err");
  mic.classList.add("live");mic.textContent="Stop";rec.start()};

/* ---- toolbar wiring ---- */
$("#tNew").onclick=newChat;$("#tSh").onclick=share;
$("#tHist").onclick=()=>{trm.hidden=true;hist.hidden=!hist.hidden;if(!hist.hidden)drawHist()};
$("#tTr").onclick=()=>{hist.hidden=true;trm.hidden=!trm.hidden};
document.addEventListener("click",e=>{
  if(!hist.contains(e.target)&&e.target.id!=="tHist")hist.hidden=true;
  if(!trm.contains(e.target)&&e.target.id!=="tTr")trm.hidden=true});
})();
</script>
